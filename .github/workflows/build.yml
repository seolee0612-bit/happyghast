name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify source files
        run: |
          find . -maxdepth 8 -type f | sort
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/java/com/seo/happyghastloader/HappyGhastChunkLoader.java
          test -f src/main/resources/fabric.mod.json

      - name: Build
        run: gradle clean build --stacktrace --info

      - name: Verify mod JAR
        run: |
          ls -lh build/libs

          MOD_JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$MOD_JAR"
          unzip -l "$MOD_JAR" | grep -q "fabric.mod.json"
          unzip -l "$MOD_JAR" | grep -q \
            "com/seo/happyghastloader/HappyGhastChunkLoader.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-chunk-loader-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
