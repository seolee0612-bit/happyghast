name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source files
        run: |
          echo "Repository files:"
          find . -maxdepth 8 -type f | sort

          test -f build.gradle
          test -f gradle.properties
          test -f settings.gradle
          test -f gradlew

          test -f src/main/java/com/seo/happyghastloader/HappyGhastChunkLoader.java
          test -f src/main/resources/fabric.mod.json

      - name: Build
        run: ./gradlew clean build --stacktrace --info

      - name: Show build outputs
        run: |
          echo "Generated JARs:"
          ls -lh build/libs
          for jar_file in build/libs/*.jar; do
            echo "===== $jar_file ====="
            unzip -l "$jar_file"
          done

      - name: Verify mod JAR
        run: |
          MOD_JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          if [ -z "$MOD_JAR" ]; then
            echo "No release mod JAR was generated."
            exit 1
          fi

          echo "Checking $MOD_JAR"

          unzip -l "$MOD_JAR" | grep -q "fabric.mod.json"
          unzip -l "$MOD_JAR" | grep -q \
            "com/seo/happyghastloader/HappyGhastChunkLoader.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-chunk-loader-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
